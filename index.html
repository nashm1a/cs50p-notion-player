<!DOCTYPE html>
    <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: url('assets/vamp.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
            overflow: hidden;
        }
        .controls-bar {
            width: fit-content;
            min-width: 440px;
            max-width: 90%;
            padding: 10px 42px;
            background: rgba(30, 30, 30, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            color: #e0e0e0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .button-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        button {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.1s ease;
        }
        button:hover { transform: scale(1.15); }
        .track-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .track-title-container {
            width: 190px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }
        .track-title {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 7s linear infinite;
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }
        @keyframes marquee {
            0%   { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .track-artist { 
            font-size: 0.95rem; 
            color: #d0d0d0; 
        }
    </style>
</head>
<body>

    <div class="controls-bar">
        <div class="button-group">
            <button id="prev-btn">⏮</button>
            <button id="play-btn">▶</button>
            <button id="next-btn">⏭</button>
        </div>
        <div class="track-info">
            <div class="track-title-container">
                <span id="track-title" class="track-title">Loading...</span>
            </div>
            <span id="track-artist" class="track-artist"></span>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const playlist = [
            { title: "Catchalot", artist: "", src: "assets/catch.mp3" }
        ];
        let currentIndex = 0;
        const player = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const titleEl = document.getElementById('track-title');
        const artistEl = document.getElementById('track-artist');

        function loadTrack(index) {
            const track = playlist[index];
            titleEl.textContent = track.title;
            artistEl.textContent = track.artist;
            player.src = track.src;
        }

        playBtn.addEventListener('click', () => {
            if (player.paused) {
                player.play();
                playBtn.textContent = '⏸';
            } else {
                player.pause();
                playBtn.textContent = '▶';
            }
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            player.play();
            playBtn.textContent = '⏸';
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            player.play();
            playBtn.textContent = '⏸';
        });

        // Initialize first track
        loadTrack(currentIndex);
    </script>
</body>
</html>
